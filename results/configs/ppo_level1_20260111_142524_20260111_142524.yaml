env:
  n_max: 14
  height: 4
  initial_level: 1
  max_level: 14
  max_steps: 500
  curriculum_window: 100
  curriculum_threshold: 0.8
training:
  total_timesteps: 100000
  n_envs: 8
  seed: 42
  eval_freq: 10000
  save_freq: 100000
  log_interval: 10
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 128
  net_arch:
  - 128
  - 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
a2c:
  learning_rate: 0.0007
  n_steps: 5
  gamma: 0.99
  gae_lambda: 1.0
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_rms_prop: true
dqn:
  learning_rate: 0.0001
  buffer_size: 100000
  learning_starts: 10000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 10000
  exploration_fraction: 0.1
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
evaluation:
  n_eval_episodes: 100
  deterministic: true
  render: false
xai:
  n_samples: 10
  n_steps_ig: 50
  save_heatmaps: true
  save_trajectories: true
  save_action_distributions: true
paths:
  models: result/models
  logs: result/logs
  evaluations: result/evaluations
  xai: result/xai
  episodes: result/episodes
  configs: result/configs
